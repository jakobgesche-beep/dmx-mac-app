<!DOCTYPE html><html><body><pre id="out"></pre>
<script src="../shared/dmx.js"></script>
<script>
const out = []; let fails = 0;
function check(name, ok, detail){ if(!ok) fails++; out.push((ok ? 'OK    ' : 'FAIL  ') + name + (detail !== undefined ? '  ' + detail : '')); }
const D = DmxCore;
const hex = (u8) => Array.from(u8).map((b) => b.toString(16).padStart(2, '0')).join(' ');

// ---- Paketformat ----
{
  const u = new Uint8Array(512); u[0] = 255; u[1] = 128; u[511] = 7;
  const p = D.buildDmxPacket(u, 512);
  check('DMX-Paket voll: 7E 06, Länge 0x0201 (513), Startcode 0, Kanäle, E7', p[0] === 0x7e && p[1] === 6 && p[2] === 0x01 && p[3] === 0x02 && p[4] === 0 && p[5] === 255 && p[6] === 128 && p[516] === 7 && p[517] === 0xe7 && p.length === 518, p.length + ' Byte, Kopf ' + hex(p.slice(0, 7)));
  const q = D.buildDmxPacket(u, 30);
  check('nur 30 Kanäle: Länge 31, Ende E7', q[2] === 31 && q[3] === 0 && q.length === 36 && q[35] === 0xe7 && q[5] === 255);
  const r = D.buildDmxPacket(u, 3);
  check('weniger als 24 Kanäle werden auf 24 aufgefüllt (Enttec-Vorgabe)', r[2] === 25 && r.length === 30);
  const s = D.buildDmxPacket(new Uint8Array([1, 2, 3]), 600);
  check('mehr als 512 Kanäle: auf 512 begrenzt', s[2] === 0x01 && s[3] === 0x02 && s[5] === 1 && s[7] === 3);
  check('Seriennummer-Anfrage: 7E 0A 00 00 E7', hex(D.requestSerial()) === '7e 0a 00 00 e7', hex(D.requestSerial()));
  check('Parameter-Anfrage: 7E 03 02 00 00 00 E7', hex(D.requestParams()) === '7e 03 02 00 00 00 e7', hex(D.requestParams()));
}

// ---- Antworten lesen ----
{
  const serial = D.buildPacket(10, new Uint8Array([0x78, 0x56, 0x34, 0x12]));
  const params = D.buildPacket(3, new Uint8Array([4, 1, 9, 1, 40]));
  const stream = new Uint8Array([0x00, 0x55, ...serial, 0xAA, ...params]);
  const r = D.parsePackets(stream);
  check('Antworten: zwei Pakete trotz Störbytes davor und dazwischen', r.packets.length === 2 && r.packets[0].label === 10 && r.packets[1].label === 3 && r.rest.length === 0);
  check('Seriennummer 0x12345678 wird als "12345678" gelesen', D.describeReply(r.packets[0]).serial === '12345678', JSON.stringify(D.describeReply(r.packets[0])));
  check('Parameter: Firmware 1.04, Break 9, MAB 1, Rate 40', JSON.stringify(D.describeReply(r.packets[1])) === JSON.stringify({ firmware: '1.04', breakTime: 9, mabTime: 1, rate: 40 }), JSON.stringify(D.describeReply(r.packets[1])));
  const half = D.parsePackets(serial.slice(0, 5));
  check('zerstückeltes Paket: noch nichts, Rest bleibt erhalten', half.packets.length === 0 && half.rest.length === 5);
  const both = D.parsePackets(new Uint8Array([...half.rest, ...serial.slice(5)]));
  check('Rest + Fortsetzung ergibt das Paket', both.packets.length === 1 && both.packets[0].label === 10);
  const bad = D.parsePackets(new Uint8Array([0x7e, 10, 4, 0, 1, 2, 3, 4, 0x00, 0x7e, 10, 0, 0, 0xe7]));
  check('Paket mit falschem Ende wird verworfen, das nächste gefunden', bad.packets.length === 1 && bad.packets[0].label === 10 && bad.packets[0].data.length === 0);
  check('unbekannte Antwort: keine Beschreibung', D.describeReply({ label: 99, data: new Uint8Array(4) }) === null);
}

// ---- Sendetakt ----
{
  let t = 0; const sent = [];
  const o = new D.DmxOutput({ write: (p) => { sent.push({ t, p }); }, now: () => t, minIntervalMs: 25, keepaliveMs: 1000, channels: 40 });
  const u = new Uint8Array(512);
  u[0] = 10; o.setFrame(u); t = 0; o.tick();
  check('erstes Bild wird sofort gesendet', sent.length === 1 && sent[0].p[5] === 10 && sent[0].p[2] === 41, 'Länge ' + sent[0].p[2]);
  // schnelle Änderungen werden auf ~40/s gebündelt
  for (let i = 1; i <= 40; i++) { t = i * 5; u[0] = 10 + i; o.setFrame(u); o.tick(); }
  const during = sent.length - 1;
  check('viele Änderungen (alle 5 ms): höchstens 1 Bild pro 25 ms (200 ms = ' + during + ' Bilder)', during >= 6 && during <= 8, String(during));
  check('das zuletzt gesendete Bild enthält den neuesten Wert oder den vorletzten (nie einen alten)', sent[sent.length - 1].p[5] >= 10 + 35);
  o.tick(); t += 30; o.tick();
  const beforeIdle = sent.length; t += 500; o.tick();
  check('ohne Änderung wird nichts gesendet (bis zur Wiederholung)', sent.length === beforeIdle);
  t += 600; o.tick();
  check('nach 1 s Stillstand wird das Bild zur Sicherheit wiederholt', sent.length === beforeIdle + 1);
  const same = sent.length; o.setFrame(u); t += 30; o.tick();
  check('gleiches Bild erneut setzen löst kein Senden aus', sent.length === same);
  o.setChannels(100); t += 30; o.tick();
  check('Kanalzahl ändern sendet ein neues, längeres Bild', sent.length === same + 1 && sent[sent.length - 1].p[2] === 101);
  o.blackout();
  const last = sent[sent.length - 1].p;
  check('Blackout: sofort ein Bild mit lauter Nullen', Array.from(last.slice(5, 5 + 100)).every((v) => v === 0));
  o.close(false); const n = sent.length; t += 5000; o.tick();
  check('nach dem Schließen wird nichts mehr gesendet', sent.length === n);
}

// ---- Fehler beim Schreiben ----
{
  const errs = []; let t = 0;
  const o = new D.DmxOutput({ write: () => { throw new Error('Port weg'); }, now: () => t, onError: (e) => errs.push(e.message) });
  o.setFrame(new Uint8Array(512).fill(5)); o.tick();
  check('Schreibfehler wird gemeldet statt zu stürzen (synchron)', errs.length === 1 && errs[0] === 'Port weg' && o.failed === 1);
  const o2 = new D.DmxOutput({ write: () => Promise.reject(new Error('asynchron kaputt')), now: () => t, onError: (e) => errs.push(e.message) });
  o2.setFrame(new Uint8Array(512).fill(5)); o2.tick();
  Promise.resolve().then(() => Promise.resolve()).then(() => {
    check('Schreibfehler wird gemeldet (asynchron)', errs.includes('asynchron kaputt'));
    out.push(fails ? '==> ' + fails + ' FEHLER' : '==> alle Tests bestanden');
    document.getElementById('out').textContent = out.join('\n');
  });
}
</script></body></html>
