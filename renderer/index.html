<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>DMX Lichtsteuerung</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="touch.css" />
</head>
<body class="plain">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5.4" fill="#26272b"/><rect x="5.01" y="3.96" width="13.98" height="0.76" rx="0.38" fill="#43454b"/><rect x="11.62" y="4.72" width="0.76" height="1.75" rx="0.23" fill="#43454b"/><path d="M10.11 10.14 L13.89 10.14 L17.71 18.58 L6.29 18.58 Z" fill="#0A84FF" fill-opacity="0.22"/><ellipse cx="12" cy="18.87" rx="5.71" ry="1.05" fill="#0A84FF"/><rect x="9.23" y="6.47" width="5.53" height="3.67" rx="0.93" fill="#e9e9ec"/><rect x="9.93" y="9.32" width="4.14" height="0.29" rx="0.15" fill="#26272b" fill-opacity="0.55"/></svg>
      <span class="brand-text">DMX <b>Lichtsteuerung</b></span>
      <span id="version-label" class="version-label"></span>
      <button id="touch-btn" class="design-toggle" title="Touch-Modus: große Bedienelemente für Touch-Monitor">Touch: aus</button>
      <button id="full-btn" class="design-toggle full-btn" title="Vollbild ein/aus">Vollbild</button>
    </div>
    <div class="conn-row">
      <div id="dmx-badge" class="badge" title="DMX-Ausgang: Klick öffnet die Einstellungen"><span id="dmx-dot" class="pulse-dot"></span><span id="dmx-text">Simulation</span></div>
    </div>
  </header>

  <nav id="tabs" class="layer-tabs"></nav>

  <main id="views">
    <section id="view-live" class="view" data-view="live"></section>
    <section id="view-devices" class="view" data-view="devices" hidden></section>
    <section id="view-settings" class="view" data-view="settings" hidden></section>
  </main>

  <footer id="livebar" class="livebar" aria-label="Immer sichtbar: Blackout, Master, Tempo"></footer>

  <script src="../shared/dmx.js"></script>
  <script src="../shared/fixtures.js"></script>
  <script src="../shared/stage.js"></script>
  <script src="../shared/effects.js"></script>
  <script src="../shared/engine.js"></script>
  <script src="util.js"></script>
  <script src="store.js"></script>
  <script src="beatclock.js"></script>
  <script src="runtime.js"></script>
  <script src="visualizer.js"></script>
  <script src="livebar.js"></script>
  <script src="page-live.js"></script>
  <script src="page-devices.js"></script>
  <script src="page-settings.js"></script>
  <script src="changelog.js"></script>
  <script src="app.js"></script>
</body>
</html>
